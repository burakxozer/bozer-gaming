<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bozer Gaming</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b0f;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
            background: #15151c;
            border: 1px solid #292934;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .logo span {
            color: #00ff88;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        p {
            color: #aaa;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #00ff88;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #00d976;
            transform: translateY(-2px);
        }

        .old-site {
            display: block;
            margin-top: 18px;
            color: #666;
            font-size: 12px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            BOZER <span>GAMING</span>
        </div>

        <h1>Yeni sitemiz hazır!</h1>

        <p>
            Bozer Gaming'in yeni deneme sitesine geçmek için
            aşağıdaki butona tıklayabilirsiniz.
        </p>

        <a
            class="btn"
            href="https://bozergaming.abacusai.app"
        >
            Yeni Deneme Sitesinde Devam Et
        </a>

        <a
            class="old-site"
            href="https://burakxozer.github.io/bozer-gaming/"
        >
            Eski siteye devam et
        </a>

    </div>

</body>
</html>
